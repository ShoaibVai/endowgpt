# =============================================================================
# endowGPT — deployment configuration (librechat.yaml)
# =============================================================================
# Loaded by the API container at /app/librechat.yaml (see docker-compose.yml).
# Secrets are referenced as ${ENV_VAR} and resolved from the environment;
# **no credentials belong in this file.**
#
# Docs: https://librechat.ai/docs/configuration/librechat_yaml
# =============================================================================

version: 1.4.0

cache: true

fileStrategy: "local"

# -----------------------------------------------------------------------------
# Attachments
# -----------------------------------------------------------------------------
# The inference gateway behind `endowGPT` speaks OpenAI's chat API but does NOT
# accept OpenAI `file` content parts: it answers
#   "file content parts are not supported here; send the image as an image_url part"
# LibreChat's system default sends `application/pdf` down the native "provider"
# path, which `formatDocumentBlock` renders as `{ type: 'file', file: {...} }`
# for any OpenAI-compatible endpoint. A turn that replays the document then fails
# on every retry, so the conversation cannot be continued.
#
# Deliver PDFs as extracted text instead: the upload parses them (RAG /text, and
# the built-in pdfjs parser if RAG has no extraction) and the turn injects that
# text as file context. Images keep the native `image_url` path, which the
# gateway does support; every other type already defaults to text.
fileConfig:
  defaultLLMDeliveryPath:
    overrides:
      application/pdf: text

# -----------------------------------------------------------------------------
# Default capabilities
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Registration defaults live partly in env (ALLOW_REGISTRATION). Keep
# socialLogins empty - email/password only.
# -----------------------------------------------------------------------------
registration:
  socialLogins: []

# -----------------------------------------------------------------------------
# Inference: a single OpenAI-compatible endpoint secured by OPENCODE_API_KEY.
# -----------------------------------------------------------------------------
endpoints:
  custom:
    - name: "endowGPT"
      apiKey: "${OPENCODE_API_KEY}"
      # OpenCode Go plan endpoint (NOT /zen/v1, which is the pay-as-you-go
      # credit API). Go quota is served on the /inference/go surface.
      baseURL: "https://opencode.ai/inference/go/openai/v1"
      # Go requires a stable session id + a client user agent for routing and
      # prompt caching. Session is scoped per user; LibreChat cannot vary
      # headers per conversation.
      headers:
        x-opencode-session: "{{LIBRECHAT_USER_ID}}"
        User-Agent: "endowGPT/1.0"
      models:
        default:
          - "deepseek-v4.1-flash"
        # The catalog is a fixed, self-hosted allow-list; do not fetch upstream.
        fetch: false
      # Cheap headline model keeps chat responses focused on the real request.
      titleConvo: true
      titleMethod: "completion"
      titleModel: "deepseek-v4.1-flash"
      titleMessageRole: "user"
      modelDisplayLabel: "endowGPT"
      iconURL: "/assets/endowgpt-mark.png"

# -----------------------------------------------------------------------------
# Model specs: the user-facing labels + per-model capabilities.
#   `fileSearch: true` -> ephemeral agent gets file-search (RAG) tooling
# -----------------------------------------------------------------------------
modelSpecs:
  enforce: true
  list:
    - name: "deepseek-v4.1-flash"
      label: "endowGPT Fast"
      description: "Fast everyday chat, editing, and document drafting."
      preset:
        endpoint: "endowGPT"
        model: "deepseek-v4.1-flash"
      default: true
      order: 1
      showOnLanding: true
      conversation_starters:
        - "Draft a document"
        - "Summarize a file"
        - "Plan my week"
      fileSearch: true
      webSearch: true

# -----------------------------------------------------------------------------
# Web search: SearXNG for discovery, a Firecrawl-compatible scraper for page
# content, no reranker. Both endpoints are private Docker hostnames, hence the
# exact host:port entries in allowedAddresses (LibreChat's SSRF guard blocks
# private destinations unless exempted).
#
# URL shape: LibreChat appends /<firecrawlVersion>/scrape to firecrawlApiUrl,
# so the value is the base URL only: http://scraper:3002/v1/scrape.
# -----------------------------------------------------------------------------
webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  searxngSearchOptions:
    engines: "google,brave,duckduckgo,yandex,wikipedia"
    language: "all"
    timeout: 10000
  scraperProvider: "firecrawl"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlVersion: "v1"
  firecrawlOptions:
    formats:
      - "markdown"
    onlyMainContent: true
  rerankerType: "none"
  scraperTimeout: 7500
  safeSearch: 1
  allowedAddresses:
    - "searxng:8080"
    - "scraper:3002"

# -----------------------------------------------------------------------------
# Interface / branding
# -----------------------------------------------------------------------------
interface:
  customWelcome: >-
    What would you like to get done?

    Ask a question, draft a document, or drop in a file — endowGPT is on it.
  landingHeading: "entity"
  landingFooter: true
  logoSplash: true
  # Allow file search + citations everywhere.
  fileSearch: true
  fileCitations: true
  # Keep the Web Search toggle in the composer/agents tool palette. The
  # tool itself is LibreChat's built-in web_search capability; no agents
  # endpoint block is needed for the ephemeral-agent toggle.
  webSearch: true
  # Deployment theme: inline definitions use the shared token vocabulary
  # (`THEME_TOKENS`). The colors below restyle the shell around endowGPT's
  # palette; anything omitted falls back to LibreChat defaults.
  # Palette: indigo 534cd6 · teal 24d5d0 · blue 6fbde0 · olive 9eab67
  #          yellow e1e366 · off-white f9f3f4 · gray b4b4b4 · red f1352a
  theme:
    version: 1
    name: "endowGPT"
    modes:
      light:
        colors:
          rgb-accent-primary: "83 76 214"             # indigo
          rgb-accent-primary-hover: "66 60 180"       # deeper indigo
          rgb-ring-primary: "36 213 208"              # teal
          rgb-focus-outline: "36 213 208"
          rgb-focus-control: "36 213 208"
          rgb-button-primary: "83 76 214"
          rgb-button-primary-hover: "66 60 180"
          rgb-link: "83 76 214"
          rgb-link-hover: "66 60 180"
          rgb-link-visited: "120 114 214"
          rgb-header-primary: "249 243 244"           # off-white
          rgb-surface-sidebar: "249 243 244"
          rgb-surface-canvas: "255 255 255"
          rgb-surface-chat: "255 255 255"
          rgb-surface-composer: "255 255 255"
          rgb-surface-card: "255 255 255"
          rgb-border-light: "232 225 227"
          rgb-border-medium: "180 180 180"            # brand gray
          rgb-surface-nav-selected: "228 226 252"
          rgb-surface-tab-selected: "228 226 252"
          rgb-illustration-subtle: "111 189 224"      # brand blue
      dark:
        colors:
          rgb-accent-primary: "107 100 240"           # brighter indigo on dark
          rgb-accent-primary-hover: "128 122 244"
          rgb-ring-primary: "36 213 208"              # teal
          rgb-focus-outline: "36 213 208"
          rgb-focus-control: "36 213 208"
          rgb-button-primary: "107 100 240"
          rgb-button-primary-hover: "128 122 244"
          rgb-link: "111 189 224"                     # brand blue
          rgb-link-hover: "152 205 232"
          rgb-link-visited: "158 171 103"             # brand olive
          rgb-header-primary: "16 18 22"
          rgb-surface-sidebar: "21 23 28"
          rgb-surface-canvas: "16 18 22"
          rgb-surface-chat: "23 25 30"
          rgb-surface-composer: "23 25 30"
          rgb-surface-card: "23 25 30"
          rgb-border-light: "44 47 55"
          rgb-border-medium: "60 64 74"
          rgb-surface-nav-selected: "38 38 68"
          rgb-surface-tab-selected: "38 38 68"
          rgb-illustration-subtle: "36 213 208"

# Speech synthesis/stt are left at LibreChat defaults for this deployment.
# -----------------------------------------------------------------------------
# Documents (endowGPT document editor limits)
# These mirror defaults in packages/data-provider/src/config.ts; the block is
# what lets a deployment retune the editor without a rebuild.
# -----------------------------------------------------------------------------
documents:
  aiEditMaxChars: 20000
  aiEditMaxPerHour: 30
  allowedAiEditModels:
    - "deepseek-v4.1-flash"
  versionHistoryCap: 50
  autosaveDelayMs: 800
  # Per-user cap across saved editor documents and generated files (100 MB).
  # Temporary chat uploads are excluded; their own TTL still applies.
  storageMaxBytes: 104857600
